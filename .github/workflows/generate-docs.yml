name: Generate docs for new Xcode versions

# Requires a self-hosted macOS runner with one or more Xcode installations under
# /Applications, since generating docs means driving each Xcode's own `mcpbridge` over
# JSON-RPC — there is no way to do this on GitHub-hosted runners or without a real Xcode.
# See README.md's "Keeping docs up to date via CI" section for one-time runner setup.
#
# This workflow only runs `generate` (English docs). It deliberately does not touch
# Documentations/ja/ — the Japanese translation is produced by a human with the
# translate-docs-ja / new-xcode-docs skill, which needs translation judgment this
# workflow can't provide.

on:
  schedule:
    - cron: "0 3 * * 1" # weekly, Monday 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: generate-docs
  cancel-in-progress: false

jobs:
  generate:
    runs-on: [self-hosted, macOS]
    steps:
      - uses: actions/checkout@v4

      - name: Generate docs for every installed Xcode
        run: make generate-all

      - name: Check for changes
        id: diff
        run: |
          git add Documentations
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open PR with new docs
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          branch="auto/xcode-docs-update"

          # Recreated from main every run, so a force push is expected here — this branch
          # is bot-owned and never meant to carry manual edits.
          git checkout -B "$branch"
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "docs: add MCP tool docs for newly detected Xcode version(s)"
          git push --force-with-lease origin "$branch"

          existing=$(gh pr list --head "$branch" --state open --json number --jq 'length')
          if [ "$existing" = "0" ]; then
            gh pr create \
              --title "Add MCP tool docs for new Xcode version(s)" \
              --base main \
              --head "$branch" \
              --body "$(cat <<'EOF'
          Auto-generated by `.github/workflows/generate-docs.yml` after detecting one or more
          Xcode installations on the self-hosted runner without a matching file in
          `Documentations/`.

          Still needed before merging:
          - [ ] Japanese translation (`translate-docs-ja` / `new-xcode-docs` skill)
          - [ ] Spot-check the rendered HTML (categories, search, raw JSON, index switcher)
          EOF
          )"
          fi
