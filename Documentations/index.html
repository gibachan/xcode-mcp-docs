<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Xcode MCP Docs</title>
<style>
:root {
  --bg: #ffffff;
  --border: #d8dce2;
  --text: #1c1e21;
  --muted: #6e7480;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #16181c;
    --border: #333840;
    --text: #e6e8eb;
    --muted: #9aa1ac;
  }
}
* { box-sizing: border-box; }
html, body {
  margin: 0;
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
}
header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 20px;
  border-bottom: 1px solid var(--border);
}
.title-group { display: flex; flex-direction: column; gap: 2px; }
h1 { margin: 0; font-size: 15px; font-weight: 600; }
.subtitle { margin: 0; font-size: 12px; color: var(--muted); }
#version, #lang {
  font-size: 14px;
  padding: 5px 8px;
  color: var(--text);
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 6px;
}
iframe {
  display: block;
  width: 100%;
  height: calc(100% - 45px);
  border: 0;
}
</style>
</head>
<body>
<header>
<div class="title-group">
<h1>Xcode MCP Docs</h1>
<p class="subtitle">docs for the tools xcode's built-in mcp server exposes, by version</p>
</div>
<select id="version" aria-label="Xcode version">
<option value="xcode-27.2-beta-mcp-tools.html" selected data-ja="1">Xcode 27.2 (Beta)</option>
<option value="xcode-27.0-mcp-tools.html" data-ja="1">Xcode 27.0</option>
<option value="xcode-26.6-mcp-tools.html">Xcode 26.6</option>
</select>
<select id="lang" aria-label="Language">
<option value="en" selected>English</option>
<option value="ja">日本語</option>
</select>
</header>
<iframe id="doc" src="xcode-27.2-beta-mcp-tools.html" title="Xcode MCP Docs"></iframe>
<script>
const select = document.getElementById('version');
const lang = document.getElementById('lang');
const frame = document.getElementById('doc');

function toolAnchor() {
  const hash = window.location.hash.slice(1);
  if (!hash) return null;
  return hash.startsWith('tool-') ? hash : `tool-${hash}`;
}

// Falls back to English when the selected version has no Japanese translation
// (the option's data-ja attribute, set by the renderer, says which ones do).
function currentFile() {
  const option = select.options[select.selectedIndex];
  const hasJapanese = option && option.dataset.ja === '1';
  return lang && lang.value === 'ja' && hasJapanese ? `ja/${select.value}` : select.value;
}

function loadFrame() {
  const anchor = toolAnchor();
  const file = currentFile();
  frame.src = anchor ? `${file}#${anchor}` : file;
}

select.addEventListener('change', loadFrame);
if (lang) lang.addEventListener('change', loadFrame);
window.addEventListener('hashchange', loadFrame);
loadFrame();
</script>
</body>
</html>
